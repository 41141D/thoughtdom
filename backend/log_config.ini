[loggers]
keys=root,uvicorn.access,uvicorn.error,thoughtdom

[handlers]
keys=defaultHandler

[formatters]
keys=defaultFormatter

[logger_root]
level=ERROR
handlers=defaultHandler

[logger_uvicorn.access]
level=CRITICAL
handlers=defaultHandler
qualname=uvicorn.access
propagate=0

[logger_uvicorn.error]
level=ERROR
handlers=defaultHandler
qualname=uvicorn.error
propagate=0

[logger_thoughtdom]
level=WARNING
handlers=defaultHandler
qualname=thoughtdom
propagate=0

[handler_defaultHandler]
class=StreamHandler
formatter=defaultFormatter
args=(sys.stderr,)

[formatter_defaultFormatter]
format=%(levelname)s %(message)s
